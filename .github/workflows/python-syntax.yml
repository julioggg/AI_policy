name: Python syntax validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile all Python scripts (no dataset required)
        run: python3 -m compileall -q scripts

  human_rating_synthetic_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install analytic dependencies
        run: python3 -m pip install -q numpy pandas scikit-learn
      - name: Run Phase 16 synthetic-only integration tests
        run: python3 -m unittest discover -s tests -p 'test_phase16_synthetic.py' -v
      - name: Run Phase 18 adjudication packet privacy and synthetic disagreement tests
        run: python3 -m unittest discover -s tests -p 'test_phase18_synthetic.py' -v
      - name: Run Phase 19 adjudication import readiness and aggregate tests
        run: python3 -m unittest discover -s tests -p 'test_phase19_synthetic.py' -v

  reviewer_excel_roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test Phase 17 synthetic Excel reviewer export and import
        run: python3 -m unittest discover -s tests -p 'test_phase17_synthetic.py' -v

  screening_excel_roundtrip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install data analysis dependencies
        run: python3 -m pip install -q numpy pandas scikit-learn
      - name: Test Phase20 synthetic blinded screening Excel workbooks and import
        run: python3 -m unittest discover -s tests -p 'test_phase20_synthetic.py' -v
      - name: Test Phase21 independent screening agreement and six-stratum public aggregation
        run: python3 -m unittest discover -s tests -p 'test_phase21_synthetic.py' -v
      - name: Test Phase22 private blinded screening adjudication export and integrity
        run: python3 -m unittest discover -s tests -p 'test_phase22_synthetic.py' -v
      - name: Test Phase23 adjudicated screening correctness, privacy and tamper detection
        run: python3 -m unittest discover -s tests -p 'test_phase23_synthetic.py' -v
      - name: Test Phase24 independent blinded QA sample privacy and export
        run: python3 -m unittest discover -s tests -p 'test_phase24_synthetic.py' -v
      - name: Test Phase25 independent screening QA comparison and nonstandard policy normalization
        run: python3 -m unittest discover -s tests -p 'test_phase25_synthetic.py' -v
      - name: Test Phase26 private methodological reconciliation dossier and source privacy
        run: python3 -m unittest discover -s tests -p 'test_phase26_synthetic.py' -v
      - name: Test Phase27 returned methods-panel integrity, readiness and validity guardrails
        run: python3 -m unittest discover -s tests -p 'test_phase27_synthetic.py' -v
      - name: Test Phase28 prospective independent calibration pilot, historical exclusion and privacy
        run: python3 -m unittest discover -s tests -p 'test_phase28_synthetic.py' -v
